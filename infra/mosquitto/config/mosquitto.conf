# ============================================================
# Configuration Mosquitto — DEV LOCAL uniquement
#
# Écoute sur le port 1883 (MQTT classique, sans chiffrement).
# allow_anonymous true : permet aux clients de se connecter sans
# mot de passe. Acceptable en développement local uniquement.
# En production, il faudra activer l'authentification.
# ============================================================

listener 1883

# DEV uniquement : à durcir avant toute mise en production
allow_anonymous true

# Journal vers la console (visible avec « docker compose logs mqtt »)
log_dest stdout

# Persistance des messages conservés (retained) entre les redémarrages
persistence true
persistence_location /mosquitto/data/
