# Configuration d'Alembic (migrations de la base de données).
#
# L'adresse de connexion ci-dessous est un SIMPLE DÉFAUT : elle est
# systématiquement remplacée par la valeur de backend/.env (ou de la
# variable DATABASE_URL) dans alembic/env.py. Ne modifiez donc pas
# cette ligne : modifiez backend/.env.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://ocp:ocp_dev_password@localhost:5432/ocp_diagnostic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
